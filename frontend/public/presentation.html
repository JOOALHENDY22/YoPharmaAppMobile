      const idx = selectedRxDrugs.indexOf(drugName);

        if (selectedRxDrugs.length > 1) selectedRxDrugs.splice(idx, 1);
      } else {
        selectedRxDrugs.push(drugName);

      // Update button styling
      ['Cipro', 'Antinal', 'Warfarin', 'Cataflam', 'Panadol', 'Concor'].forEach(d => {

        norm.innerHTML = 'النطاق الطبيعي: <strong class="text-emerald-400 block text-xs">0.6 – 1.2 mg/dL</strong>';
      } else if (metric === 'hba1c') {
        lbl.textContent = 'أدخل السكر التراكمي (%):';
        inp.value = '8.5';
        norm.innerHTML = 'النطاق المستهدف: <strong class="text-emerald-400 block text-xs">< 6.5 %</strong>';
      } else if (metric === 'inr') {
        lbl.textContent = 'أدخل سيولة الدم (INR):';
        inp.value = '3.8';
        norm.innerHTML = 'الهدف العلاجي: <strong class="text-emerald-400 block text-xs">2.0 – 3.0</strong>';
      } else if (metric === 'bp') {
        lbl.textContent = 'أدخل الضغط الانقباضي (mmHg):';
        inp.value = '155';
        norm.innerHTML = 'الضغط المثالي: <strong class="text-emerald-400 block text-xs">< 120/80 mmHg</strong>';
      }
      evalVitalsNumber(inp.value);
    };

    window.evalVitalsNumber = function(val) {
      const n = parseFloat(val) || 0;
      const badge = document.getElementById('vitalsStatusBadge');
      const guide = document.getElementById('vitalsGuidance');
      const card = document.getElementById('vitalsOutputCard');
      if (!badge || !guide || !card) return;

      if (selectedVitalsMetric === 'creatinine') {
        if (n <= 1.2) {
          card.className = 'p-2 sm:p-2.5 rounded-xl bg-emerald-950/40 border border-emerald-800 text-xs space-y-0.5';
          badge.className = 'font-bold text-emerald-400 block text-xs';
          badge.textContent = '🟢 النتيجة: طبيعي (eGFR > 90)';
          guide.textContent = 'وظائف الكلى سليمة ولا تحتاج لتعديل جرعات الأدوية.';
        } else {
          card.className = 'p-2 sm:p-2.5 rounded-xl bg-red-950/40 border border-red-800 text-xs space-y-0.5';
          badge.className = 'font-bold text-red-400 block text-xs';
          badge.textContent = '🔴 النتيجة: مرتفع (Renal Warning)';
          guide.textContent = 'يشير لانخفاض وظائف الكلى (eGFR < 45). يلزم خفض جرعات المضادات ومسكنات NSAIDs بنسبة 50%.';
        }
      } else if (selectedVitalsMetric === 'hba1c') {
        if (n < 7.0) {
          card.className = 'p-2 sm:p-2.5 rounded-xl bg-emerald-950/40 border border-emerald-800 text-xs space-y-0.5';
          badge.className = 'font-bold text-emerald-400 block text-xs';
          badge.textContent = '🟢 السكر منضبط (Good Glycemic Control)';
          guide.textContent = 'استمر على نفس الخطة العلاجية والجرعات الحالية.';
        } else {
          card.className = 'p-2 sm:p-2.5 rounded-xl bg-amber-950/40 border border-amber-800 text-xs space-y-0.5';
          badge.className = 'font-bold text-amber-400 block text-xs';
          badge.textContent = '🟠 السكر غير منضبط (Uncontrolled Diabetes)';
          guide.textContent = 'يلزم مراجعة الطبيب لإضافة دواء مساعد أو تعديل جرعة الأنسولين/الميتفورمين.';
        }
      } else if (selectedVitalsMetric === 'inr') {
        if (n >= 2.0 && n <= 3.0) {
          card.className = 'p-2 sm:p-2.5 rounded-xl bg-emerald-950/40 border border-emerald-800 text-xs space-y-0.5';
          badge.className = 'font-bold text-emerald-400 block text-xs';
          badge.textContent = '🟢 سيولة الدم مثالية (Target INR 2-3)';
          guide.textContent = 'جرعة الوارفارين الحالية آمنة وتحقق الحماية المطلوبة.';
        } else {
          card.className = 'p-2 sm:p-2.5 rounded-xl bg-red-950/40 border border-red-800 text-xs space-y-0.5';
          badge.className = 'font-bold text-red-400 block text-xs';
          badge.textContent = '🔴 خطر نزيف (Elevated Bleeding Risk)';
          guide.textContent = 'السيولة أعلى من النطاق العلاجي؛ يلزم خفض جرعة الوارفارين وتجنب المسكنات تماماً.';
        }
      } else if (selectedVitalsMetric === 'bp') {
        if (n < 130) {
          card.className = 'p-2 sm:p-2.5 rounded-xl bg-emerald-950/40 border border-emerald-800 text-xs space-y-0.5';
          badge.className = 'font-bold text-emerald-400 block text-xs';
          badge.textContent = '🟢 ضغط الدم طبيعي ومستقر';
          guide.textContent = 'استقرار ممتاز بفضل الالتزام بالعلاج ومثبطات بيتا.';
        } else {
          card.className = 'p-2 sm:p-2.5 rounded-xl bg-red-950/40 border border-red-800 text-xs space-y-0.5';
          badge.className = 'font-bold text-red-400 block text-xs';
          badge.textContent = '🔴 ارتفاع ضغط الدم (Stage 2 HTN)';
          guide.textContent = 'يلزم تقليل الصوديوم وتجنب مسكنات NSAIDs التي تعطل فاعلية أدوية الضغط.';
        }
      }
    };

    window.pickAlternativesDrug = function(key) {
      const drug = demoDrugDB[key] || demoDrugDB['Augmentin'];
      const card = document.getElementById('alternativesListCard');
      if (!card) return;

      card.innerHTML = drug.generics.map(g => `
        <div class="p-1.5 rounded-lg bg-slate-900 border border-slate-800 flex items-center justify-between">
          <div>
            <span class="font-bold text-white text-xs block">${g.name}</span>
            <span class="text-[10px] text-slate-400">${g.mfg} • ${drug.inn}</span>
          </div>
          <span class="text-[9px] ${g.tier.includes('اقتصادي') ? 'bg-teal-950 text-teal-300 border border-teal-700' : 'bg-emerald-950 text-emerald-300 border border-emerald-700'} px-1.5 py-0.5 rounded font-bold">${g.tier}</span>
        </div>
      `).join('');
    };

    window.evalChronicDemo = function() {
      const drug = document.getElementById('chronicDrugSelect')?.value;
      const cond = document.getElementById('chronicCondSelect')?.value;
      const badge = document.getElementById('chronicBadge');
      const reason = document.getElementById('chronicReason');
      const card = document.getElementById('chronicResultCard');
      if (!badge || !reason || !card) return;

      if (drug === 'Cataflam' && (cond === 'ckd' || cond === 'htn')) {
        card.className = 'p-2.5 rounded-xl bg-red-950/40 border border-red-800 space-y-1';
        badge.className = 'font-bold text-red-400 block text-xs';
        badge.textContent = '🚫 ممنوع تماماً (Contraindicated)';
        reason.textContent = 'مسكنات NSAIDs تمنع تدفق الدم الكلوي وترفع الضغط بنسبة 15mmHg. البديل: Panadol.';
      } else if (drug === 'Glucophage' && cond === 'ckd') {
        card.className = 'p-2.5 rounded-xl bg-red-950/40 border border-red-800 space-y-1';
        badge.className = 'font-bold text-red-400 block text-xs';
        badge.textContent = '🚫 ممنوع إذا كان eGFR < 30 (Lactic Acidosis)';
        reason.textContent = 'خطر تراكم حمض اللاكتيك في الدم مع انخفاض وظائف الكلى. البديل: مثبطات DPP-4.';
      } else if (drug === 'Concor' && cond === 'asthma') {
        card.className = 'p-2.5 rounded-xl bg-amber-950/40 border border-amber-800 space-y-1';
        badge.className = 'font-bold text-amber-400 block text-xs';
        badge.textContent = '🟠 حذر شديد (Caution in Severe Asthma)';
        reason.textContent = 'رغم انتقائيته لـ B1، الجرعات العالية قد تسبب تقلص الشعب الهوائية.';
      } else {
        card.className = 'p-2.5 rounded-xl bg-emerald-950/40 border border-emerald-800 space-y-1';
        badge.className = 'font-bold text-emerald-400 block text-xs';
        badge.textContent = '🟢 آمن تحت المتابعة الدورية (Safe)';
        reason.textContent = 'لا توجد موانع مباشرة؛ الدواء مناسب ومصنف كخيار علاجي معتمد للحالة.';
      }
    };

    window.pickComparePair = function(type) {
      const compA_Name = document.getElementById('compA_Name');
      const compA_Inn = document.getElementById('compA_Inn');
      const compB_Name = document.getElementById('compB_Name');
      const compB_Inn = document.getElementById('compB_Inn');
      const compElim = document.getElementById('compElim');
      const compVerdict = document.getElementById('compVerdict');
      if (!compA_Name) return;

      if (type === 'nsaid') {
        compA_Name.textContent = 'Cataflam 50mg';
        compA_Inn.textContent = 'Diclofenac Pot. (Fast Onset)';
        compB_Name.textContent = 'Brufen 400mg';
        compB_Inn.textContent = 'Ibuprofen (Mild Analgesic)';
        compElim.textContent = 'كبدي 60% / كلوي 40%';
        compVerdict.innerHTML = '💡 <strong>التوصية:</strong> Cataflam أسرع في تسكين آلام الأسنان والمغص، بينما Brufen ألطف على المعدة.';
      } else if (type === 'abx') {
        compA_Name.textContent = 'Augmentin 1g';
        compA_Inn.textContent = 'Amoxicillin/Clavulanate';
        compB_Name.textContent = 'Zithromax 500mg';
        compB_Inn.textContent = 'Azithromycin (Macrolide)';
        compElim.textContent = 'أوجمنتين (كلوي) / زيثروماكس (كبدي)';
        compVerdict.innerHTML = '💡 <strong>التوصية:</strong> Zithromax خيار مثالي لمرضى حساسية البنسلين وجرعته سهلة (قرص يومياً لمدة 3 أيام).';
      } else {
        compA_Name.textContent = 'Concor 5mg';
        compA_Inn.textContent = 'Bisoprolol (B1 selective)';
        compB_Name.textContent = 'Tenormin 50mg';
        compB_Inn.textContent = 'Atenolol (Renal Excreted)';
        compElim.textContent = '50% كبدي / 50% كلوي';
        compVerdict.innerHTML = '💡 <strong>التوصية:</strong> يُفضل Concor لمرضى الكلى والشعب الهوائية لاستقراره الدوائي وتوازنه.';
      }
    };

    function nextSlide() {
      const data = presentationData[currentLang];
      if (currentSlide < data.slides.length - 1) {
        currentSlide++;
        renderPresentation();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderPresentation();
      }
    }

    function goToSlide(index) {
      currentSlide = index;
      renderPresentation();
    }

    document.getElementById('nextBtn').addEventListener('click', nextSlide);
    document.getElementById('prevBtn').addEventListener('click', prevSlide);

    document.getElementById('langToggleBtn').addEventListener('click', () => {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      const root = document.getElementById('htmlRoot');
      if (currentLang === 'ar') {
        root.setAttribute('dir', 'rtl');
        root.setAttribute('lang', 'ar');
      } else {
        root.setAttribute('dir', 'ltr');
        root.setAttribute('lang', 'en');
      }
      renderPresentation();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown') {
        if (currentLang === 'ar') prevSlide(); else nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp' || e.key === ' ') {
        if (currentLang === 'ar') nextSlide(); else prevSlide();
      }
    });

    // Touch swipe handling (Reversed / Inverted direction)
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;

    window.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      const deltaX = touchEndX - touchStartX;
      const deltaY = touchEndY - touchStartY;

      // Inverted swipe logic: swipe right -> nextSlide(), swipe left -> prevSlide()
      if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 35) {
        if (deltaX > 0) {
          nextSlide();
        } else {
          prevSlide();
        }
      }
    }, { passive: true });

    renderPresentation();
  </script>
</body>
</html>
